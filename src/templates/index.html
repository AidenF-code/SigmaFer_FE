<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SigmaFer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estyles/index.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="container">

        <section class="glass-panel">

            <!-- Decoraciones -->
            <span class="shine shine-top"></span>
            <span class="shine shine-bottom"></span>
            <span class="glass-light"></span>

            <!-- Línea divisoria -->
            <div class="divider"></div>

            <!-- Panel izquierdo -->
            <div class="left-panel">

                <img
                    class="logo"
                    src="{{ url_for('static', filename='imagenes/logo-login-sigmafer.png') }}"
                    alt="Logo SigmaFer">

            </div>

            <!-- Panel derecho -->
            <div class="right-panel">

                <article class="login-card">

                    <h1>Iniciar sesión</h1>

                    <!-- MENSAJES FLASH Y DE ERROR -->
                    {% if error %}
                    <div class="login-alert-error" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 16px;"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                {% if category != 'error' %}
                                <div class="login-alert-info" style="background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.4); color: #93c5fd; padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;">
                                    <i class="fa-solid fa-circle-info" style="font-size: 16px;"></i>
                                    <span>{{ message }}</span>
                                </div>
                                {% endif %}
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="{{ url_for('index.inicio') }}" method="POST">

                        <!-- Correo -->
                        <div class="input-group">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                name="email"
                                placeholder="Correo electrónico"
                                value="{{ email or '' }}"
                                autocomplete="email"
                                required>

                        </div>

                        <!-- Contraseña -->
                        <div class="input-group">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                name="password"
                                placeholder="Contraseña"
                                autocomplete="current-password"
                                required>

                        </div>

                        <button type="submit" class="btn-submit" style="width: 100%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fa-solid fa-right-to-bracket"></i> Ingresar
                        </button>

                    </form>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
