{% extends 'inventarios/base_inventarios.html' %}

{% block title %}Nueva Categoría - SigmaFer{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='estyles/inventarios/crear_productos.css') }}">
{% endblock %}

{% block content %}

<div class="container">

    <div class="module-card" style="max-width: 600px; margin: 40px auto;">

        <!-- HEADER -->
        <div class="module-header">
            <h2>Nueva Categoría</h2>

            <div class="window-actions">
                <a href="{{ url_for('inventarios.lista_categorias') }}" class="btn-close-pro" title="Volver a la lista">
                    <i class="fa-solid fa-xmark"></i>
                </a>
            </div>
        </div>

        <!-- FORMULARIO -->
        <div class="module-body">

            <form class="form-grid" method="POST" style="grid-template-columns: 1fr;">

                <div class="form-group">
                    <label for="nombre">Nombre de la Categoría *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        value="{{ nombre or '' }}" 
                        placeholder="Ej: Herramientas Manuales, Pinturas, Tuberías..." 
                        required
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" name="estado" required>
                        <option value="Activo" {% if estado == 'Activo' or not estado %}selected{% endif %}>Activo</option>
                        <option value="Inactivo" {% if estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                    </select>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <a href="{{ url_for('inventarios.lista_categorias') }}" class="btn cancel">
                        <i class="fa-solid fa-arrow-left"></i> Cancelar
                    </a>
                    <button type="submit" class="btn save">
                        <i class="fa-solid fa-check"></i> Guardar Categoría
                    </button>
                </div>

            </form>

            {% if error %}
            <div class="form-error" style="margin-top: 20px;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

        </div>

    </div>

</div>

{% endblock %}
