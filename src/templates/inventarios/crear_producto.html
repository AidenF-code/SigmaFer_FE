{% extends 'inventarios/base_inventarios.html' %}

{% block title %}crear producto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='estyles/inventarios/crear_productos.css') }}">
{% endblock %}

{% block content %}

<div class="container">
    
    <div class="module-card">
        
        <!-- HEADER -->
        <div class="module-header">
            <h2>Nuevo Producto</h2>
            
            <div class="window-actions">
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <span class="dot red"></span>
            </div>
        </div>
        
        <!-- CUERPO -->
        <div class="module-body">
            
            <form class="form-grid" method="POST">
                
                <input type="text" name="nombre" placeholder="Nombre del producto" required>
                <input type="text" name="codigo" placeholder="Código" required>
                
                <select name="proveedor_id" required>
                    <option value="" disabled selected>Proveedor</option>
                    {% for proveedor in proveedores %}
                        <option value="{{ proveedor.id }}">
                            {{ proveedor.nombre }}
                        </option>
                    {% endfor %}
                </select>
                
                <select name="categoria_id" required>
                    <option value="" disabled selected>
                        Categoría
                    </option>

                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}">
                            {{ categoria.nombre }}
                        </option>
                    {% endfor %}
                </select>
                
                <input type="number" name="stock" placeholder="Stock" step="0.01" min="0" required>
                <input type="number" name="stock_minimo" placeholder="Stock mínimo" step="0.01" min="0" required>
                
                <input type="number" name="stock_maximo" placeholder="Stock máximo" step="0.01" min="0">
                <input type="number" name="precio" placeholder="Precio" required>
                
                <select name="estado" required>
                    <option value="1" selected>Activo</option>
                    <option value="0">Inactivo</option>
                </select>

                <div class="form-actions">

                    <a href="{{ url_for('inventarios.inicio') }}" class="btn cancel">Cancelar</a>
                    
                    <button type="submit" class="btn save">Guardar</button>

                </div>
                
            </form>
            {% if error %}
                <div class="form-error">
                    {{ error }}
                </div>
            {% endif %}
  
        </div>
        
    </div>
    
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/inventarios/crear_producto.js') }}"></script>
{% endblock %}
