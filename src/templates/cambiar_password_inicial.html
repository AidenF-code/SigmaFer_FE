<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Primer Ingreso | SigmaFer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estyles/index.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .password-requirements {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 15px;
            padding-left: 5px;
            line-height: 1.5;
        }
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.35);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="glass-panel">

            <!-- Decoraciones -->
            <span class="shine shine-top"></span>
            <span class="shine shine-bottom"></span>
            <span class="glass-light"></span>

            <!-- Línea divisoria -->
            <div class="divider"></div>

            <!-- Panel izquierdo -->
            <div class="left-panel">
                <img
                    class="logo"
                    src="{{ url_for('static', filename='imagenes/logo-login-sigmafer.png') }}"
                    alt="Logo SigmaFer">
            </div>

            <!-- Panel derecho -->
            <div class="right-panel">

                <article class="login-card">

                    <div class="security-badge">
                        <i class="fa-solid fa-shield-halved"></i> Primer Inicio de Sesión
                    </div>

                    <h1>Nueva Contraseña</h1>

                    <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 18px;">
                        Hola <strong style="color: #60a5fa;">{{ usuario.nombre if usuario else 'Usuario' }}</strong>, por políticas de seguridad debes cambiar tu contraseña temporal antes de continuar.
                    </p>

                    <!-- MENSAJES DE ERROR -->
                    {% if error %}
                    <div class="login-alert-error" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px;">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 16px;"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form action="{{ url_for('index.cambiar_password_inicial') }}" method="POST">

                        <!-- Nueva Contraseña -->
                        <div class="input-group">
                            <i class="fa-solid fa-lock"></i>
                            <input
                                type="password"
                                name="password_nueva"
                                placeholder="Nueva contraseña (mínimo 8 caracteres)"
                                minlength="8"
                                required
                                autofocus
                                autocomplete="new-password">
                        </div>

                        <!-- Confirmar Nueva Contraseña -->
                        <div class="input-group">
                            <i class="fa-solid fa-lock-open"></i>
                            <input
                                type="password"
                                name="password_confirmar"
                                placeholder="Confirmar nueva contraseña"
                                minlength="8"
                                required
                                autocomplete="new-password">
                        </div>

                        <div class="password-requirements">
                            <i class="fa-solid fa-circle-info" style="color: #60a5fa;"></i> La contraseña debe tener al menos 8 caracteres.
                        </div>

                        <button type="submit" class="btn-submit" style="width: 100%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fa-solid fa-check"></i> Actualizar y Continuar al Login
                        </button>

                        <div style="text-align: center; margin-top: 15px;">
                            <a href="{{ url_for('index.logout') }}" style="color: #94a3b8; font-size: 13px; text-decoration: none;">
                                <i class="fa-solid fa-arrow-left"></i> Cancelar y volver al inicio
                            </a>
                        </div>

                    </form>

                </article>

            </div>

        </section>

    </main>

</body>

</html>
